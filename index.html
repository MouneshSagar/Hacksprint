<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Start Quiz &mdash; Gateway</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Animated background glow */
    .glow-blob {
      filter: blur(90px);
      transition: all 4s ease-in-out;
    }

    /* Ambient animated ring */
    @keyframes pulse-ring {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.08);
        opacity: 0.3;
      }
      100% {
        transform: scale(0.95);
        opacity: 0.8;
      }
    }

    .pulse-ring-effect {
      animation: pulse-ring 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    /* Subtle grid pattern */
    .bg-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-[#090D16] text-white min-h-screen flex items-center justify-center relative overflow-hidden selection:bg-indigo-500 selection:text-white px-4">

  <!-- Ambient Light Orbs -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-[550px] h-[550px] bg-indigo-600/20 rounded-full glow-blob"></div>
    <div class="absolute -bottom-32 left-1/2 -translate-x-1/2 w-[500px] h-[500px] bg-violet-600/20 rounded-full glow-blob"></div>
    <div class="absolute inset-0 bg-grid"></div>
  </div>

  <!-- Central Centered Card -->
  <div class="relative z-10 w-full max-w-md mx-auto text-center">
    
    <!-- Glassmorphic Container -->
    <div class="p-8 sm:p-10 rounded-3xl bg-slate-900/60 backdrop-blur-2xl border border-white/10 shadow-2xl shadow-indigo-950/50 flex flex-col items-center">
      
      <!-- Live Status Badge -->
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-semibold uppercase tracking-wider mb-6">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        <span>Live Session Ready</span>
      </div>

      <!-- Main Heading -->
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mb-2 leading-tight">
        Enter Quiz
      </h1>

      <!-- Subtitle -->
      <p class="text-base sm:text-lg text-slate-300 font-medium mb-8">
        All the best!
      </p>

      <!-- Prominent Glowing Action Button -->
      <div class="relative w-full group">
        <!-- Pulsing background glow -->
        <div class="absolute -inset-1 rounded-2xl bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 opacity-60 blur-lg group-hover:opacity-100 group-hover:blur-xl transition duration-500 pulse-ring-effect"></div>

        <!-- Main Clickable Anchor Button -->
        <a 
          id="quizBtn"
          href="https://app.sli.do/event/ueeWRpnvzqexHkXMD8dCFK/embed/polls/98ab872b-90ee-4392-8486-7857cea98d34" 
          target="_blank" 
          rel="noopener noreferrer"
          class="relative w-full flex items-center justify-center gap-3 px-8 py-4.5 text-base sm:text-lg font-bold text-white bg-gradient-to-r from-indigo-600 via-indigo-500 to-violet-600 rounded-2xl shadow-xl transition-all duration-300 transform group-hover:scale-[1.02] active:scale-[0.98] border border-white/20"
        >
          <span>Click to Start</span>
          <svg class="w-5 h-5 transition-transform duration-300 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
          </svg>
        </a>
      </div>

      <!-- Route destination indicator -->
      <div class="mt-6 flex items-center justify-center gap-2 text-xs text-slate-400">
        <svg class="w-3.5 h-3.5 text-emerald-400" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
        </svg>
        <span>Instant redirection to official live poll</span>
      </div>

    </div>

  </div>

</body>
</html>
